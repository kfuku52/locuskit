[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "kffractbias"
version = "0.2.0.dev11"
description = "Compatibility metadata for consumers of the FractBias module in LOCUSKIT"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["locuskit==0.2.0.dev11"]

[project.optional-dependencies]
plot = ["locuskit[plot]==0.2.0.dev11"]
compare = ["locuskit[compare]==0.2.0.dev11"]
all = ["locuskit[all]==0.2.0.dev11"]

[tool.setuptools]
packages = []
